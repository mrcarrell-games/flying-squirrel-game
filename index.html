// ------------------
// UPDATE FUNCTIONS
// ------------------
function update() {
  if (gameOver) return;
  if (isPaused) return;

  // Squirrel physics
  squirrel.velocity += gravity;
  squirrel.velocity *= airResistance;
  squirrel.y += squirrel.velocity;

  // Ground collision
  if (squirrel.y + squirrel.height > canvas.height - groundHeight) {
    handleDeath();
    return;        
  }

  // Ceiling collision
  if (squirrel.y < 0) {
    squirrel.y = 0;
    squirrel.velocity = 0;
  }

  // Ground scroll
  groundX -= groundSpeed;
  if (groundX <= -canvas.width) {
    groundX = 0;
  }

  bgX -= bgSpeed;

  // reset seamlessly when one image scrolls off
  if (bgX <= -canvas.width) {
  bgX = 0;
  }

  if (
  !owlActive &&
  !owlCompletedForLevel &&
  !owlQueued &&
  totalNutsCollected >= nutsNeededForOwl
) {
  treeSpawningEnabled = false;
  owlQueued = true;
  owlSpawnCountdown = 240; // 6 seconds at 60fps

  message = "Find Origin the Owl!";
  messageTimer = 180;
}

if (owlQueued) {
  owlSpawnCountdown--;

  if (owlSpawnCountdown <= 0) {
    spawnOwlTree();
    owlActive = true;
    owlQueued = false;
  }
}

nutClusterTimer++;

if (nutClusterTimer >= nextNutClusterIn) {
  nutClusterTimer = 0;
  nextNutClusterIn = getRandomNutClusterInterval();

  spawnNutCluster();
}

  // Obstacles update
  updateTrees();
  updateNuts();
  updateCrows();
  updateThrownNuts();
  updateGroundBushes();

  // Move nut clusters EVERY FRAME
  for (let i = nutClusters.length - 1; i >= 0; i--) {
    const nut = nutClusters[i];

    nut.x -= groundBushSpeed;

    // remove offscreen
    if (nut.x + nut.width < 0) {
      nutClusters.splice(i, 1);
    }
   }

  for (let i = nutClusters.length - 1; i >= 0; i--) {
  const nut = nutClusters[i];

  if (!nut.collected && isColliding(squirrel, nut)) {
    nut.collected = true;

    const reward = Math.floor(Math.random() * 3) + 3; 
  // gives 3, 4, or 5

  nutCount += reward;
  nutAmmo += reward;
  totalNutsCollected += reward;
  totalScore += 100;

  message = "You found a nut cluster!";
    messageTimer = 90;
  }
 }
}

let groundScroll = 0;

function updateGroundBushes() {
  // only advance ONCE per frame
  groundScroll += groundBushSpeed;

  const tileW = groundTileWidth;

  const first = groundSegments[0];

  if (!first) return;

  if (groundScroll >= tileW) {
    groundScroll -= tileW;

    groundSegments.shift();

    const last = groundSegments[groundSegments.length - 1];

    const img = groundBushImages[Math.floor(Math.random() * groundBushImages.length)];

    groundSegments.push({
      x: last.x + tileW,
      image: img
    });
  }
}

function updateBonusLevel() {
  // Timer check
  bonusLevelTimer++;
  if (bonusLevelTimer >= bonusLevelDuration) {
    bonusLevelTimer = 0;
    exitBonusLevel();
    return;
  }

  // Squirrel physics
  squirrel.velocity += gravity;
  squirrel.velocity *= airResistance;
  squirrel.y += squirrel.velocity;

  // Ceiling collision
  if (squirrel.y < 0) {
    squirrel.y = 0;
    squirrel.velocity = 0;
  }

  // Hit ground → exit bonus level
  if (squirrel.y + squirrel.height > canvas.height - groundHeight) {
    exitBonusLevel();
    return;
  }

  // Scroll background and ground
  bgX -= bgSpeed;
  if (bgX <= -canvas.width) bgX = 0;

  updateGroundBushes();

  // Spawn bonus nuts
  bonusNutsSpawnTimer++;
  if (bonusNutsSpawnTimer >= bonusNutsSpawnInterval) {
    bonusNutsSpawnTimer = 0;
    spawnBonusNut();
  }

  // Spawn nut clusters same as normal game
  nutClusterTimer++;
  if (nutClusterTimer >= nextNutClusterIn) {
    nutClusterTimer = 0;
    nextNutClusterIn = getRandomNutClusterInterval();
    spawnNutCluster();
  }

  // Collect nuts
  for (let i = nuts.length - 1; i >= 0; i--) {
    const nut = nuts[i];
    nut.x -= nutSpeed;

    const nutHitbox = {
      x: nut.x,
      y: nut.y,
      width: nut.size,
      height: nut.size
    };

    if (isColliding(squirrel, nutHitbox)) {
      const worth = nut.multiplier ? Math.round((nut.multiplier - 1.0) / 0.1) + 1 : 1;
      nutCount += worth;
      nutAmmo += worth;
      totalNutsCollected += worth;
      totalScore += worth * 10;
      nuts.splice(i, 1);
      continue;
    }

    if (nut.x + nut.size < 0) {
      nuts.splice(i, 1);
    }
  }

  // Collect nut clusters
  for (let i = nutClusters.length - 1; i >= 0; i--) {
    const nut = nutClusters[i];
    nut.x -= groundBushSpeed;

    if (nut.x + nut.width < 0) {
      nutClusters.splice(i, 1);
      continue;
    }

    if (!nut.collected && isColliding(squirrel, nut)) {
      nut.collected = true;
      const reward = Math.floor(Math.random() * 3) + 3;
      nutCount += reward;
      nutAmmo += reward;
      totalNutsCollected += reward;
      totalScore += 100;
      message = "Nut cluster!";
      messageTimer = 90;
    }
  }

  updateThrownNuts();
}

function startGame() {
  resizeCanvas();
  updateCrowSettings();

  nextTreeIn = getRandomTreeInterval();
  treeSpawnTimer = 0;
  
  treeSpawnTimer = nextTreeIn;

  requestAnimationFrame(gameLoop);
}

function updateThrownNuts() {
    for (let i = thrownNuts.length - 1; i >= 0; i--) {
        const nut = thrownNuts[i];
        nut.x += thrownNutSpeed;  // move right toward crows

        // Check collision with crows
        for (let j = crows.length - 1; j >= 0; j--) {

    y: leafTop,
    width: leavesWidth,
    height: leafBottom - leafTop,

    p2: { x: leavesX + leavesWidth / 2, y: leafTop    },

 }

function spawnNutBetweenTrees(currentTree) {
  const estimatedGap = nextTreeIn * treeSpeed;
  const x = canvas.width + currentTree.width / 2 + estimatedGap / 2;

  // Make sure nut doesn't overlap the current tree's hitboxes vertically
  let forbiddenTop = canvas.height;
  let forbiddenBottom = 0;

  if (currentTree.hitboxes?.leaves) {
    forbiddenTop = Math.min(forbiddenTop, currentTree.hitboxes.leaves.y);
  }

  if (currentTree.hitboxes?.trunk) {
    forbiddenTop = Math.min(forbiddenTop, currentTree.hitboxes.trunk.y);
  }

  const safeTop = 50;
  const safeBottom = canvas.height - groundHeight - nutSize - 20;

  if (safeBottom <= safeTop) return;

  // Pick a y that is above the tree hitboxes or in the open sky
  // Try up to 10 times to find a valid y position
  let y;
  let attempts = 0;

  do {
    y = Math.random() * (safeBottom - safeTop) + safeTop;
    attempts++;
  } while (y > forbiddenTop - nutSize && y < safeBottom && attempts < 10);

  nuts.push({
    x: x,
    y: y,
    size: nutSize,
    multiplier: 1.0
  });
}

function spawnNut() {

  nuts.push({

    y: y,
    size: nutSize
  });

function spawnCrow() {
  if (crowsPerSpawn <= 0) return;

  for (let i = 0; i < crowsPerSpawn; i++) {
    const yMin = canvas.height * 0.1;
    const yMax = canvas.height * 0.7;

    // Divide the vertical space into equal slots, one per crow
    const slotHeight = (yMax - yMin) / crowsPerSpawn;
    const slotTop = yMin + i * slotHeight;
    const y = slotTop + Math.random() * slotHeight;
    const xOffset = i * 80;

    crows.push({
      x: canvas.width + 50 + xOffset,
      y: y,
      width: crowWidth,
      height: crowHeight,
      flapOffset: Math.floor(Math.random() * 6),
      hit: false,
      fallSpeed: 0
    });
  }

  const raccoonY = canvas.height - branchYFromBottom - raccoonHeight;
  const raccoonX = pineX + pineWidth / 2 + rightOffsets[raccoonIndex];

  // Direction toward squirrel at moment of throw
  const dx = squirrel.x - startX;
  const dy = squirrel.y - startY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const speed = 4;

  const rc = raccoons[raccoonIndex];

  bossProjectiles.push({

    y: startY,
    width: 20,

    velX: velX,

    startY: startY,

  });

function pointInTriangle(px, py, x1, y1, x2, y2, x3, y3) {
  const area = Math.abs(
    (x2 - x1) * (y3 - y1) - (x3 - x1) * (y2 - y1)
  );

  const area1 = Math.abs(
    (x1 - px) * (y2 - py) - (x2 - px) * (y1 - py)
  );

  const area2 = Math.abs(
    (x2 - px) * (y3 - py) - (x3 - px) * (y2 - py)
  );

  const area3 = Math.abs(
    (x3 - px) * (y1 - py) - (x1 - px) * (y3 - py)
  );

  return Math.abs(area - (area1 + area2 + area3)) < 0.5;
}

function updateCrowSettings() {
  // Each "cycle" of 4 levels repeats with increasing difficulty
  // Level 1 = no crows
  // Level 2 = crows at base speed
  // Level 3 = crows faster
  // Level 4 = crows more often
  // Level 5 = crows in pairs
  // Then repeats with cumulative speed/frequency increases

  if (level === 1) {
    crowsPerSpawn = 0;
    crowSpeed = baseCrowSpeed;
    crowSpawnInterval = baseCrowSpawnInterval;
    return;
  }

  // Which cycle are we in (0-indexed)
  // Level 2-5 = cycle 0, Level 6-9 = cycle 1, etc.
  const cycleLevel = level - 2; // level 2 becomes 0
  const cycle = Math.floor(cycleLevel / 4);
  const positionInCycle = cycleLevel % 4;

  // Base values that increase each cycle
  const cycleSpeedBoost = cycle * 0.5;
  const cycleIntervalReduction = cycle * 0.85; // multiplier gets smaller each cycle

  switch (positionInCycle) {
    case 0: // Levels 2, 6, 10... — crows appear at increasing base speed
      crowsPerSpawn = 1 + cycle;
      crowSpeed = baseCrowSpeed + cycleSpeedBoost;
      crowSpawnInterval = baseCrowSpawnInterval * Math.pow(cycleIntervalReduction || 1, cycle);
      break;

    case 1: // Levels 3, 7, 11... — crows fly faster
      crowsPerSpawn = 1 + cycle;
      crowSpeed = baseCrowSpeed + cycleSpeedBoost + 1;
      crowSpawnInterval = baseCrowSpawnInterval * Math.pow(cycleIntervalReduction || 1, cycle);
      break;

    case 2: // Levels 4, 8, 12... — crows appear more often
      crowsPerSpawn = 1 + cycle;
      crowSpeed = baseCrowSpeed + cycleSpeedBoost + 1;
      crowSpawnInterval = baseCrowSpawnInterval * Math.pow(0.75, cycle + 1);
      break;

    case 3: // Levels 5, 9, 13... — crows in pairs (extra crow per spawn)
      crowsPerSpawn = 2 + cycle;
      crowSpeed = baseCrowSpeed + cycleSpeedBoost + 1;
      crowSpawnInterval = baseCrowSpawnInterval * Math.pow(0.75, cycle + 1);
      break;
  }

  // Hard floor so interval never gets absurdly low
  crowSpawnInterval = Math.max(crowSpawnInterval, 120);
}

function updateBossLevel() {
  if (gameWon) return;

  // Squirrel physics
  squirrel.velocity += gravity;
  squirrel.velocity *= airResistance;
  squirrel.y += squirrel.velocity;

  // Ceiling collision
  if (squirrel.y < 0) {
    squirrel.y = 0;
    squirrel.velocity = 0;
  }

  // Hit ground → die
  if (squirrel.y + squirrel.height > canvas.height - groundHeight) {
    handleDeath();
    return;
  }

  // Animate angry man
  angryManFrameTimer++;
  if (angryManFrameTimer >= angryManFrameInterval) {
    angryManFrameTimer = 0;
    angryManFrame = (angryManFrame + 1) % angryManImages.length;
  }

  // Animate raccoons
  // Update each raccoon independently
  for (let i = 0; i < raccoons.length; i++) {
    const rc = raccoons[i];

    // Handle dead raccoon spinning off screen
    if (rc.dead) {
      if (rc.spinX !== null) {
        rc.spinX += rc.spinVelX;
        rc.spinY += rc.spinVelY;
        rc.spinAngle += 0.2;
        rc.spinVelY += 0.1; // gravity
      }
      continue;
    }

    // Handle immunity flash
    if (rc.immune) {
      rc.immuneTimer++;
      rc.flashTimer++;
      if (rc.immuneTimer >= rc.immuneDuration) {
        rc.immune = false;
        rc.immuneTimer = 0;
        rc.flashTimer = 0;
      }
    }

    // Handle healing every 10 seconds
    rc.healTimer++;
    if (rc.healTimer >= rc.healInterval) {
      rc.healTimer = 0;
      rc.health = Math.min(rc.maxHealth, rc.health + 0);
    }

    if (rc.throwing) {
      rc.frameTimer++;
      if (rc.frameTimer >= rc.frameInterval) {
        rc.frameTimer = 0;
        rc.frame++;

        if (rc.frame === 3) {
          spawnBossProjectile(i);
        }

        if (rc.frame >= raccoonSets[rc.set].length) {
          rc.frame = 0;
          rc.throwing = false;
          rc.throwTimer = 0;
          rc.throwInterval = getRandomThrowInterval();
        }
      }
    } else {
      rc.throwTimer++;
      if (rc.throwTimer >= rc.throwInterval) {
        rc.throwing = true;
        rc.frame = 1;
        rc.frameTimer = 0;
      }
    }
  }

  // Check thrown nuts vs raccoons
  updateThrownNutsVsRaccoons();

  updateBossProjectiles();
  updateThrownNuts();
}

function spawnBonusNut() {
  const sizeMultipliers = [1.0, 1.1, 1.2, 1.3, 1.4];
  const multiplier = sizeMultipliers[Math.floor(Math.random() * sizeMultipliers.length)];

  const size = Math.round(nutSize * multiplier);

  const yMin = canvas.height * 0.6;
  const yMax = canvas.height - groundHeight - groundTileHeight - size;
  const y = Math.random() * (yMax - yMin) + yMin;

  nuts.push({
    x: canvas.width + Math.random() * 200,
    y: y,
    size: size,
    multiplier: multiplier
  });
}

function updateBossProjectiles() {
  for (let i = bossProjectiles.length - 1; i >= 0; i--) {
    const p = bossProjectiles[i];
    p.age++;

    if (p.type === "can") {
      // Straight line, spins
      p.x += p.velX;
      p.y += p.velY;
      p.angle += 0.15;
    }

    else if (p.type === "apple") {
      // Looping sine wave pattern, spins
      p.x += p.velX;
      p.y += p.velY + Math.sin(p.age * 0.04) * 2;
      p.angle += 0.12;
    }

    else if (p.type === "plate") {
  p.x += p.velX;

  // Normalize progress across screen (right → left)
  const progress = 1 - (p.x / canvas.width); // 0 → 1

  // Gentle downward glide at first
  const downward = progress * 1.5;

  // Smooth upward lift near left side
  const riseStart = 0.3; // when it starts rising
  let upward = 0;

  if (progress > riseStart) {
    const t = (progress - riseStart) / (1 - riseStart);
    upward = t * t * 8.5; // smooth gradual rise
  }

  p.y += p.velY + downward - upward;

  p.angle += 0.08;
}

    // Check collision with squirrel
    const hitbox = {
      x: p.x - p.width / 2,
      y: p.y - p.height / 2,
      width: p.width,
      height: p.height
    };

    if (isColliding(squirrel, hitbox)) {
      bossProjectiles.splice(i, 1);
      handleDeath();
      return;
    }

    // Remove if offscreen
    if (p.x + p.width < 0 || p.x > canvas.width ||
        p.y + p.height < 0 || p.y > canvas.height) {
      bossProjectiles.splice(i, 1);
    }
  }
}

function drawGroundBushes() {
  if (!groundReady) return;

  const tileW = groundTileWidth;

  const startIndex = Math.floor(groundScroll / tileW);
  const offsetX = -(groundScroll % tileW);

  for (let i = 0; i < groundSegments.length + 2; i++) {
    const img = groundSegments[(startIndex + i) % groundSegments.length]?.image;

    ctx.drawImage(
      img,
      x,
      canvas.height - groundTileHeight,
      tileW,
      groundTileHeight

function drawBossLevel() {
  // Static background — no scroll
  if (bgLoaded) {
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  }

  const groundY = canvas.height - groundHeight;

  // --- Pine tree on far right, full height ---
  if (bossPineTreeLoaded) {
    const pineWidth = bossPineTreeImage.naturalWidth *
      (canvas.height / bossPineTreeImage.naturalHeight);
    ctx.drawImage(
      bossPineTreeImage,
      canvas.width - pineWidth,
      0,
      pineWidth,
      canvas.height
    );
  }

  // --- Raccoons on pine tree branches ---
  if (raccoonSetsLoaded > 0 && bossPineTreeLoaded) {
    const pineWidth = bossPineTreeImage.naturalWidth *
      (canvas.height / bossPineTreeImage.naturalHeight);
    const pineX = canvas.width - pineWidth;

    const raccoonHeight = 60;
    const pineScale = canvas.height / bossPineTreeImage.naturalHeight;
    const rightOffsets = [20, 50, 90];

    for (let i = 0; i < raccoons.length; i++) {
      const rc = raccoons[i];
      const imgSet = raccoonSets[rc.set];
      const currentImg = imgSet[Math.min(rc.frame, imgSet.length - 1)];

      if (!currentImg || !currentImg.complete || currentImg.naturalWidth === 0) continue;

      const raccoonWidth = currentImg.naturalWidth *
        (raccoonHeight / currentImg.naturalHeight);

      const branchYFromBottom = branchOffsets[i] * pineScale;
      const raccoonY = canvas.height - branchYFromBottom - raccoonHeight;
      const raccoonX = pineX + pineWidth / 2 - raccoonWidth / 2 + rightOffsets[i];

      // Handle dead raccoon spinning off screen
      if (rc.dead && rc.spinX !== null) {
        ctx.save();
        ctx.translate(rc.spinX, rc.spinY);
        ctx.rotate(rc.spinAngle);
        ctx.drawImage(currentImg, -raccoonWidth / 2, -raccoonHeight / 2, raccoonWidth, raccoonHeight);
        ctx.restore();
        continue;
      }

      // Flash when immune — skip every other 5 frames
      if (rc.immune && Math.floor(rc.flashTimer / 5) % 2 === 0) continue;

      ctx.drawImage(currentImg, raccoonX, raccoonY, raccoonWidth, raccoonHeight);

      // Draw health bar
      drawRaccoonHealthBar(i, raccoonX, raccoonY, raccoonWidth);
    }
  }

  // --- Angry man just to the left of pine tree ---
  if (angryManLoaded > 0) {
    const currentAngryMan = angryManImages[angryManFrame];
    if (currentAngryMan.complete && currentAngryMan.naturalWidth > 0) {
      const angryManHeight = 120;
      const angryManWidth = currentAngryMan.naturalWidth *
        (angryManHeight / currentAngryMan.naturalHeight);

      const pineWidth = bossPineTreeLoaded
        ? bossPineTreeImage.naturalWidth * (canvas.height / bossPineTreeImage.naturalHeight)
        : 100;

      const angryManX = canvas.width - pineWidth - angryManWidth - 10;
      const angryManY = groundY - angryManHeight;

      ctx.drawImage(currentAngryMan, angryManX, angryManY, angryManWidth, angryManHeight);
    }
  }

  // --- Speech bubble above angry man ---
  if (angryManLoaded > 0) {
    const currentAngryMan = angryManImages[angryManFrame];
    if (currentAngryMan.complete && currentAngryMan.naturalWidth > 0) {
      const angryManHeight = 120;
      const angryManWidth = currentAngryMan.naturalWidth *
        (angryManHeight / currentAngryMan.naturalHeight);

      const pineWidth = bossPineTreeLoaded
        ? bossPineTreeImage.naturalWidth * (canvas.height / bossPineTreeImage.naturalHeight)
        : 100;

      const angryManX = canvas.width - pineWidth - angryManWidth - 10;
      const angryManY = groundY - angryManHeight;

      // Speech bubble dimensions
      const bubblePadding = 12;
      const bubbleRadius = 12;

      ctx.font = "bold 16px Arial";
      ctx.textAlign = "left";

      // Word wrap the speech text
      const speechText = "Bring back my supplies you dagnab critters!";
      const maxBubbleWidth = 180;
      const speechLineHeight = 22;
      const speechWords = speechText.split(" ");
      const speechLines = [];
      let currentLine = "";

      for (let n = 0; n < speechWords.length; n++) {
        const testLine = currentLine + speechWords[n] + " ";
        if (ctx.measureText(testLine).width > maxBubbleWidth - bubblePadding * 2 && n > 0) {
          speechLines.push(currentLine.trim());
          currentLine = speechWords[n] + " ";
        } else {
          currentLine = testLine;
        }
      }
      speechLines.push(currentLine.trim());

      const bubbleWidth = maxBubbleWidth;
      const bubbleHeight = speechLines.length * speechLineHeight + bubblePadding * 2;

      // Position bubble to the right of angry man
      const bubbleX = angryManX + angryManWidth + 50;
      const bubbleY = angryManY - bubbleHeight + 70;

      // Draw rounded bubble box with pointer on left side
      ctx.fillStyle = "white";
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 2;

      const pointerTipX = angryManX + angryManWidth / 2 + 20;
      const pointerTipY = angryManY + 30;
      const pointerBaseTop = bubbleY + 15;
      const pointerBaseBottom = bubbleY + 40;

      ctx.beginPath();

      // Top edge
      ctx.moveTo(bubbleX + bubbleRadius, bubbleY);
      ctx.lineTo(bubbleX + bubbleWidth - bubbleRadius, bubbleY);

      // Top right corner
      ctx.quadraticCurveTo(bubbleX + bubbleWidth, bubbleY, bubbleX + bubbleWidth, bubbleY + bubbleRadius);

      // Right edge
      ctx.lineTo(bubbleX + bubbleWidth, bubbleY + bubbleHeight - bubbleRadius);

      // Bottom right corner
      ctx.quadraticCurveTo(bubbleX + bubbleWidth, bubbleY + bubbleHeight, bubbleX + bubbleWidth - bubbleRadius, bubbleY + bubbleHeight);

      // Bottom edge
      ctx.lineTo(bubbleX + bubbleRadius, bubbleY + bubbleHeight);

      // Bottom left corner
      ctx.quadraticCurveTo(bubbleX, bubbleY + bubbleHeight, bubbleX, bubbleY + bubbleHeight - bubbleRadius);

      // Left edge bottom to pointer base bottom
      ctx.lineTo(bubbleX, pointerBaseBottom);

      // Pointer tip
      ctx.lineTo(pointerTipX, pointerTipY);

      // Pointer base top back to left edge
      ctx.lineTo(bubbleX, pointerBaseTop);

      // Left edge pointer base top to top left corner
      ctx.lineTo(bubbleX, bubbleY + bubbleRadius);

      // Top left corner
      ctx.quadraticCurveTo(bubbleX, bubbleY, bubbleX + bubbleRadius, bubbleY);

      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Draw text inside bubble
      ctx.fillStyle = "#222222";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "left";

      for (let i = 0; i < speechLines.length; i++) {
        ctx.fillText(
          speechLines[i],
          bubbleX + bubblePadding,
          bubbleY + bubblePadding + (i + 1) * speechLineHeight - 5
        );
      }

      ctx.textAlign = "left";
    }
  }

  // --- Tent to the left of angry man ---
  if (bossTentLoaded) {
    const tentHeight = 150;
    const tentWidth = bossTentImage.naturalWidth *
      (tentHeight / bossTentImage.naturalHeight);

    const pineWidth = bossPineTreeLoaded
      ? bossPineTreeImage.naturalWidth * (canvas.height / bossPineTreeImage.naturalHeight)
      : 100;

    const angryManWidth = angryManLoaded > 0 && angryManImages[0].complete
      ? angryManImages[0].naturalWidth * (120 / angryManImages[0].naturalHeight)
      : 80;

    const tentX = canvas.width - pineWidth - angryManWidth - tentWidth - 20;
    const tentY = groundY - tentHeight;

    ctx.drawImage(bossTentImage, tentX, tentY, tentWidth, tentHeight);
  }

  drawBossProjectiles();

  // Draw squirrel
  drawSquirrel();

  // Draw thrown nuts
  drawThrownNuts();

  // Draw UI
  drawNuts();

  // Draw message
  // Draw message
  if (messageTimer > 0) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fillRect(0, canvas.height / 3 - 30, canvas.width, 60);
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.textAlign = "center";
    ctx.fillText(message, canvas.width / 2, canvas.height / 3);
    ctx.textAlign = "left";
    messageTimer--;
  }

  if (gameWon) {
    drawGameWon();
  }

  if (gameOver) {
    drawGameOver();
  }

  if (isPaused) {
    drawPauseMenu();
  } else if (!gameOver) {
    drawPausePrompt();
  }
}

  ctx.lineTo(boxX + boxWidth - cornerRadius, boxY);

  ctx.lineTo(boxX + boxWidth, boxY + boxHeight - cornerRadius);
  ctx.quadraticCurveTo(boxX + boxWidth, boxY + boxHeight, boxX + boxWidth - cornerRadius, boxY + boxHeight);
  ctx.lineTo(boxX + cornerRadius, boxY + boxHeight);
  ctx.quadraticCurveTo(boxX, boxY + boxHeight, boxX, boxY + boxHeight - cornerRadius);
  ctx.lineTo(boxX, boxY + cornerRadius);
  ctx.quadraticCurveTo(boxX, boxY, boxX + cornerRadius, boxY);
  ctx.closePath();
  ctx.fill();

  // Optional border
  ctx.strokeStyle = "#C8B89A";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Dividing line between left and right halves
  const midX = boxX + boxWidth / 2;

  ctx.moveTo(midX, boxY + 20);

  ctx.stroke();

  // --- LEFT HALF: sumdogtalk.gif ---
  const leftCenterX = boxX + boxWidth / 4;

    // Advance frame
    sumdogTalkFrameTimer++;
    if (sumdogTalkFrameTimer >= sumdogTalkFrameInterval) {
      sumdogTalkFrameTimer = 0;
      sumdogTalkFrame = (sumdogTalkFrame + 1) % sumdogTalkImages.length;
    }

    const currentImg = sumdogTalkImages[sumdogTalkFrame];

    if (currentImg.complete && currentImg.naturalWidth > 0) {
      const maxImgWidth = boxWidth / 2 - 60;
      const maxImgHeight = boxHeight - 80;

        maxImgWidth / currentImg.naturalWidth,
        maxImgHeight / currentImg.naturalHeight
      );
      const imgDrawWidth = currentImg.naturalWidth * imgScale;
      const imgDrawHeight = currentImg.naturalHeight * imgScale;
      const imgX = leftCenterX - imgDrawWidth / 2;
      const imgY = leftCenterY - imgDrawHeight / 2;

      ctx.drawImage(currentImg, imgX, imgY, imgDrawWidth, imgDrawHeight);

  }

  // --- RIGHT HALF: text ---
  const rightX = midX + 30;

  const textStartY = boxY + 80;
  const lineHeight = 36;

  ctx.fillStyle = "#2C1A0E";
  ctx.font = "22px Arial";
  ctx.textAlign = "left";

  // Word wrap function
  function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    let currentY = y;

    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + " ";
      const metrics = ctx.measureText(testLine);

      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, currentY);
        line = words[n] + " ";
        currentY += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, currentY);
    return currentY;
  }

  const introText = "Hi, my name is Sum Dog and welcome to one of my many adventures. Today, we won't learn math...we will just play the game, but, before we get started, I want you to introduce you to someone...";
  wrapText(introText, rightX, textStartY, rightWidth, lineHeight);

    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.textAlign = "left";
  }
}

    const maxImgWidth = boxWidth / 2 - 60;
    const maxImgHeight = boxHeight - 80;
    const imgScale = Math.min(
      maxImgWidth / currentImg.naturalWidth,
      maxImgHeight / currentImg.naturalHeight
    );
    const imgDrawWidth = currentImg.naturalWidth * imgScale;
    const imgDrawHeight = currentImg.naturalHeight * imgScale;
    const imgX = leftCenterX - imgDrawWidth / 2;
    const imgY = leftCenterY - imgDrawHeight / 2;
    ctx.drawImage(currentImg, imgX, imgY, imgDrawWidth, imgDrawHeight);
  }

  // --- RIGHT HALF: overflow text from owl page 1 ---
  const rightX = midX + 30;
  const rightWidth = boxWidth / 2 - 60;
  const textStartY = boxY + 80;
  const lineHeight = 36;
  const maxTextY = boxY + boxHeight - 100;

  ctx.fillStyle = "#2C1A0E";
  ctx.font = "22px Arial";
  ctx.textAlign = "left";

  function wrapText(text, x, y, maxWidth, lineHeight, maxY) {
    const words = text.split(" ");
    let line = "";
    let currentY = y;
    let overflowWords = [];
    let overflowing = false;

    for (let n = 0; n < words.length; n++) {
      if (overflowing) {
        overflowWords.push(words[n]);
        continue;
      }
      const testLine = line + words[n] + " ";
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        if (maxY && currentY + lineHeight > maxY) {
          overflowing = true;
          overflowWords.push(words[n]);
          continue;
        }
        ctx.fillText(line, x, currentY);
        line = words[n] + " ";
        currentY += lineHeight;
      } else {
        line = testLine;
      }
    }
    if (!overflowing && maxY && currentY + lineHeight <= maxY) {
      ctx.fillText(line, x, currentY);
    } else if (!overflowing) {
      overflowWords = line.trim().split(" ");
    } else {
      ctx.fillText(line, x, currentY);
    }
    return {
      lastY: currentY,
      overflow: overflowWords.length > 0 ? overflowWords.join(" ") : null
    };
  }

  window.owlPage2Overflow = [];
  let currentY = textStartY;

  if (window.owlPage1Overflow && window.owlPage1Overflow.length > 0) {
    for (let i = 0; i < window.owlPage1Overflow.length; i++) {
      const result = wrapText(window.owlPage1Overflow[i], rightX, currentY, rightWidth, lineHeight, maxTextY);
      if (result.overflow) window.owlPage2Overflow.push(result.overflow);
      currentY = result.lastY + lineHeight * 1.5;
    }
  }

  // Flashing continue prompt
  owlPage2FlashTimer++;
  if (owlPage2FlashTimer >= flashInterval) {
    owlPage2FlashTimer = 0;
    owlPage2FlashVisible = !owlPage2FlashVisible;
  }

  if (owlPage2FlashVisible) {
    ctx.fillStyle = "#8B0000";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    ctx.shadowColor = "black";
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    ctx.fillText("Press C to Continue or B to go Back", midX + boxWidth / 4, boxY + boxHeight - 40);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.textAlign = "left";
  }
}

function drawLevel1OwlPage3() {
  // Skip this page if there is no overflow
  if (!window.owlPage2Overflow || window.owlPage2Overflow.length === 0) {
    onLevel1OwlPage3 = false;
    isPaused = false;
    showingQuestion = true;
    currentQuestion = getQuestion();
    return;
  }

  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const boxPadding = 60;
  const boxX = boxPadding;
  const boxY = boxPadding;
  const boxWidth = canvas.width - boxPadding * 2;
  const boxHeight = canvas.height - boxPadding * 2;
  const cornerRadius = 30;

  ctx.fillStyle = "#F5F0E1";
  ctx.beginPath();
  ctx.moveTo(boxX + cornerRadius, boxY);
  ctx.lineTo(boxX + boxWidth - cornerRadius, boxY);
  ctx.quadraticCurveTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + cornerRadius);
  ctx.lineTo(boxX + boxWidth, boxY + boxHeight - cornerRadius);
  ctx.quadraticCurveTo(boxX + boxWidth, boxY + boxHeight, boxX + boxWidth - cornerRadius, boxY + boxHeight);
  ctx.lineTo(boxX + cornerRadius, boxY + boxHeight);
  ctx.quadraticCurveTo(boxX, boxY + boxHeight, boxX, boxY + boxHeight - cornerRadius);
  ctx.lineTo(boxX, boxY + cornerRadius);
  ctx.quadraticCurveTo(boxX, boxY, boxX + cornerRadius, boxY);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#C8B89A";
  ctx.lineWidth = 3;
  ctx.stroke();

  const midX = boxX + boxWidth / 2;
  ctx.strokeStyle = "#C8B89A";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(midX, boxY + 20);
  ctx.lineTo(midX, boxY + boxHeight - 20);
  ctx.stroke();

  // --- LEFT HALF: owl image ---
  const leftCenterX = boxX + boxWidth / 4;
  const leftCenterY = boxY + boxHeight / 2;

  owlTalkTimer++;
  if (owlTalkTimer >= 20) {
    owlTalkTimer = 0;
    owlTalkFrame = (owlTalkFrame + 1) % 2;
  }

  const currentImg = owlTalkFrame === 0 ? owlTalk1 : owlTalk2;

  if (currentImg.complete && currentImg.naturalWidth > 0) {
    const maxImgWidth = boxWidth / 2 - 60;
    const maxImgHeight = boxHeight - 80;
    const imgScale = Math.min(
      maxImgWidth / currentImg.naturalWidth,
      maxImgHeight / currentImg.naturalHeight
    );
    const imgDrawWidth = currentImg.naturalWidth * imgScale;
    const imgDrawHeight = currentImg.naturalHeight * imgScale;
    const imgX = leftCenterX - imgDrawWidth / 2;
    const imgY = leftCenterY - imgDrawHeight / 2;
    ctx.drawImage(currentImg, imgX, imgY, imgDrawWidth, imgDrawHeight);
  }

  // --- RIGHT HALF: overflow from page 2 ---
  const rightX = midX + 30;
  const rightWidth = boxWidth / 2 - 60;
  const textStartY = boxY + 80;
  const lineHeight = 36;
  const maxTextY = boxY + boxHeight - 100;

  ctx.fillStyle = "#2C1A0E";
  ctx.font = "22px Arial";
  ctx.textAlign = "left";

  function wrapText(text, x, y, maxWidth, lineHeight, maxY) {
    const words = text.split(" ");
    let line = "";
    let currentY = y;
    let overflowWords = [];
    let overflowing = false;

    for (let n = 0; n < words.length; n++) {
      if (overflowing) {
        overflowWords.push(words[n]);
        continue;
      }
      const testLine = line + words[n] + " ";
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        if (maxY && currentY + lineHeight > maxY) {
          overflowing = true;
          overflowWords.push(words[n]);
          continue;
        }
        ctx.fillText(line, x, currentY);
        line = words[n] + " ";
        currentY += lineHeight;
      } else {
        line = testLine;
      }
    }
    if (!overflowing && maxY && currentY + lineHeight <= maxY) {
      ctx.fillText(line, x, currentY);
    } else if (!overflowing) {
      overflowWords = line.trim().split(" ");
    } else {
      ctx.fillText(line, x, currentY);
    }
    return {
      lastY: currentY,
      overflow: overflowWords.length > 0 ? overflowWords.join(" ") : null
    };
  }

  let currentY = textStartY;

  for (let i = 0; i < window.owlPage2Overflow.length; i++) {
    const result = wrapText(window.owlPage2Overflow[i], rightX, currentY, rightWidth, lineHeight, maxTextY);
    currentY = result.lastY + lineHeight * 1.5;
  }

  // Flashing continue prompt
  owlPage3FlashTimer++;
  if (owlPage3FlashTimer >= flashInterval) {
    owlPage3FlashTimer = 0;
    owlPage3FlashVisible = !owlPage3FlashVisible;
  }

  if (owlPage3FlashVisible) {
    ctx.fillStyle = "#8B0000";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    ctx.shadowColor = "black";
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
    ctx.fillText("Press C to Continue or B to go Back", midX + boxWidth / 4, boxY + boxHeight - 40);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.textAlign = "left";
  }
}

function drawRaccoonHealthBar(raccoonIndex, screenX, screenY, raccoonWidth) {
  const rc = raccoons[raccoonIndex];
  if (rc.dead) return;

  const barWidth = 100;
  const barHeight = 10;
  const barX = screenX + raccoonWidth / 2 - barWidth / 2;
  const barY = screenY - 18;

  const healthPercent = rc.health / rc.maxHealth;
  const fillWidth = barWidth * healthPercent;

  // Black background
  ctx.fillStyle = "black";
  ctx.fillRect(barX, barY, barWidth, barHeight);

  // Health color
  if (healthPercent > 0.5) {
    ctx.fillStyle = "#00cc00";
  } else if (healthPercent > 0.25) {
    ctx.fillStyle = "orange";
  } else {
    ctx.fillStyle = "red";
  }

  ctx.fillRect(barX, barY, fillWidth, barHeight);

  // Border
  ctx.strokeStyle = "white";
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barWidth, barHeight);
}

function drawBossProjectiles() {
  for (let i = 0; i < bossProjectiles.length; i++) {
    const p = bossProjectiles[i];

    let img = null;
    if (p.type === "apple" && appleLoaded) img = appleImage;
    else if (p.type === "can" && canLoaded) img = canImage;
    else if (p.type === "plate" && plateLoaded) img = plateImage;

    if (!img) continue;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.drawImage(img, -p.width / 2, -p.height / 2, p.width, p.height);
    ctx.restore();
  }
}

function drawNutClusters() {
  if (!showHitboxes) return;

  ctx.fillStyle = "red";

  nutClusters.forEach(nut => {
    if (!nut.collected) {
      ctx.fillRect(nut.x, nut.y, nut.width, nut.height);
    }
  });
}

// For dead trees only
function drawDeadTreeHitboxes(tree) {
  if (!tree.isDeadTree || !tree.hitboxes) return;

  const h = tree.hitboxes;
  ctx.lineWidth = 2;

  ctx.strokeStyle = "red";
  ctx.strokeRect(h.leaves.x,    h.leaves.y,    h.leaves.width,    h.leaves.height);
  ctx.strokeRect(h.lowerTrunk.x, h.lowerTrunk.y, h.lowerTrunk.width, h.lowerTrunk.height);

  ctx.strokeStyle = "yellow";
  ctx.strokeRect(h.hole.x, h.hole.y, h.hole.width, h.hole.height);
}

// For normal trees only — handles both rect and triangle types
function drawNormalTreeHitboxes(tree) {
  if (tree.isDeadTree || !tree.hitboxes?.leaves) return;

  const leaves = tree.hitboxes.leaves;
  ctx.lineWidth = 2;
  ctx.strokeStyle = "lime";

  if (leaves.type === "rect") {
    ctx.strokeRect(leaves.x, leaves.y, leaves.width, leaves.height);
  }
  else if (leaves.type === "triangle") {
    ctx.beginPath();
    ctx.moveTo(leaves.p1.x, leaves.p1.y);
    ctx.lineTo(leaves.p2.x, leaves.p2.y);
    ctx.lineTo(leaves.p3.x, leaves.p3.y);
    ctx.closePath();
    ctx.stroke();
  }

  if (tree.hitboxes.trunk) {
    ctx.strokeStyle = "red";
    ctx.strokeRect(
      tree.hitboxes.trunk.x,
      tree.hitboxes.trunk.y,
      tree.hitboxes.trunk.width,
      tree.hitboxes.trunk.height
    );
  }
}

function drawTestBoxes() {
  const baseY = canvas.height - groundHeight;

  const heights = [50, 100, 150, 200, 250, 300];

  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  ctx.font = "16px Arial";
  ctx.fillStyle = "red";

  heights.forEach((h, i) => {
    const x = 50 + i * 80; // space them horizontally

    // Draw rectangle (grows upward from ground)
    ctx.strokeRect(x, baseY - h, 40, h);

    // Label the height
    ctx.fillText(h + "px", x, baseY - h - 5);
  });
}

function drawSquirrel() {
  const img = squirrelImages[currentFrame];

  if (!img.complete) return;

  ctx.drawImage(
    img,
    squirrel.x,
    squirrel.y,
    squirrel.width,
    squirrel.height
  );
}

function drawThrownNuts() {
    if (!thrownNutLoaded || !thrownNutImage.complete) {
        // Fallback to orange square while image is loading
        ctx.fillStyle = "orange";
        thrownNuts.forEach(nut => {
            ctx.fillRect(nut.x, nut.y, nut.width, nut.height);
        });
        return;
    }

    thrownNuts.forEach(nut => {
        ctx.drawImage(
            thrownNutImage,
            nut.x,
            nut.y,
            nut.width,      // 15px as defined earlier
            nut.height
        );
    });
}

function drawTrees() {
  trees.forEach(tree => {
    // Normal trees
    if (!tree.hasOwl) {
      const treeTop = canvas.height - groundHeight - tree.height;

      if (tree.image && tree.image.complete) {
        ctx.drawImage(
         tree.image,
         tree.x,
         treeTop,
         tree.width,
         tree.height
      );
      } else {
         // fallback (just in case image hasn't loaded yet)
         ctx.fillStyle = "#228B22";
         ctx.fillRect(
           tree.x,
           treeTop,
           tree.width,
           tree.height
        );
       }
      }

    // 🦉 Owl on pole
    if (tree.hasOwl && owlLoaded && owlImage.complete) {
      const scale = 0.4; // adjust this to make the owl bigger/smaller

      const owlDisplayHeight = owlImage.naturalHeight * scale;
      const owlDisplayWidth = owlImage.naturalWidth * scale;

      const owlX = tree.x + tree.width / 2 - owlDisplayWidth / 2;
      const owlY = canvas.height - groundHeight - owlDisplayHeight;

      ctx.drawImage(owlImage, owlX, owlY, owlDisplayWidth, owlDisplayHeight);
      
      const padding = Math.min(100, owlDisplayWidth / 3);

      tree.owlHitbox = {
        x: owlX + padding,
        y: owlY - 200,
        width: owlDisplayWidth - padding * 2,
        height: owlDisplayHeight
      };      
    } else {
      // Clean up hitbox if owl is gone
      if (tree.owlHitbox) delete tree.owlHitbox;
    }
  });
}

function drawNuts() {
  // Draw the bouncing nuts on screen
  nuts.forEach(nut => {
    const bounce = Math.sin(Date.now() / 200) * 5;
    ctx.drawImage(
      nutImage,
      nut.x,
      nut.y + bounce,
      nut.size,
      nut.size
    );
  });

  // UI Text - clean and reliable
  ctx.fillStyle = "white";
  ctx.font = "bold 24px Arial";
  ctx.textAlign = "left";

  // Optional shadow for better readability (applied once)
  ctx.shadowColor = "black";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;

  ctx.fillText("Nuts Collected: " + nutAmmo, 20, 70);
  ctx.fillText("Level: " + level, 20, 105);
  ctx.fillText("Lives: " + lives, 20, 140);
  ctx.fillText("Score: " + totalScore, 20, 175);

  // Reset shadow so it doesn't affect the rest of the drawing
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}

function drawCrowsBehindBushes() {
  crows.forEach(crow => {
    if (crow.hit) return; // skip hit crows

    const index = (crowFrame + (crow.flapOffset || 0)) % crowAnimationSequence.length;
    const frame = crowImages[crowAnimationSequence[index]];
    if (!frame.complete) return;

    ctx.drawImage(frame, crow.x, crow.y, crow.width, crow.height);
  });
}

function drawCrowsInFrontOfBushes() {
  crows.forEach(crow => {
    if (!crow.hit) return; // only hit crows

    const frame = crowImages[3];
    if (!frame.complete) return;

    ctx.save();
    ctx.translate(crow.x + crow.width / 2, crow.y + crow.height / 2);
    ctx.rotate(Math.PI);
    ctx.drawImage(frame, -crow.width/2, -crow.height/2, crow.width, crow.height);
    ctx.restore();
  });
}

function drawGameOver() {
  ctx.fillStyle = "white";
  ctx.font = "40px Arial";
  ctx.fillText("Game Over - Press R to Restart",
               canvas.width / 2 - 250,
               canvas.height / 2);
}

// ------------------
// COLLISION FUNCTION
// ------------------
function isColliding(a, b) {
  return a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

// ------------------
// RESET
// ------------------
function resetGame(fullReset = false) {

  // ---------------------------
  // PLAYER RESET
  // ---------------------------
  squirrel.y = canvas.height * 0.15;
  squirrel.velocity = 0;

  nuts = [];
  crows = [];
  thrownNuts = [];

  nutAmmo = 0;

  gameOver = false;
  isPaused = false;
  gameWon = false;

  messageTimer = 120;

  // ---------------------------
  // WORLD RESET (always)
  // ---------------------------
  trees = [];
  treeSpawnTimer = 0;
  nextTreeIn = getRandomTreeInterval();
  lastTreeObj = null;

  owlTree = null;
  owlActive = false;
  owlQueued = false;
  owlCompletedForLevel = false;

  treeSpawningEnabled = true;

  lastTreeRightEdge = 0;

  // IMPORTANT: prevents instant re-trigger after reset
  currentQuestion = null;
  showingQuestion = false;

  inBonusLevel = false;
  inBossLevel = false;

  // ---------------------------
  // FULL RESET (new game)
  // ---------------------------
  if (fullReset || !checkpoint) {

    totalNutsCollected = 0;
    nutCount = 0;
    totalScore = 0;

    level = 1;
    nutsNeededForOwl = 5;

    lives = 3;

    checkpoint = null;

    message = "";
    messageTimer = 0;
    return;
  }

  // ---------------------------
  // CHECKPOINT RESET (after death)
  // ---------------------------

  totalNutsCollected = checkpoint.nuts;
  nutCount = checkpoint.nuts;

  level = checkpoint.level;
  nutsNeededForOwl = checkpoint.nutsNeeded;

  lives = Math.max(lives, 1);

  message = "Back to checkpoint!";

  // IMPORTANT FIX:
  // Do NOT allow owl to spawn instantly after reset
  owlActive = false;
  owlQueued = false;
  owlTree = null;
  owlCompletedForLevel = false;

  // Give breathing room so owl cannot spawn immediately
  // (prevents overlap with trees or instant trigger)
  treeSpawnTimer = 0;
  nextTreeIn = getRandomTreeInterval();

  // ensure progression continues normally
  isPaused = false;
}

function resetLevel() {
  squirrel.y = canvas.height * 0.15;
  squirrel.velocity = 0;

  nuts = [];
  crows = [];
  thrownNuts = [];
  nutClusters = [];

  nutAmmo = 0;
  nutCount = 0;
  totalNutsCollected = nutsNeededForOwl - 5; // reset to start of current level

  trees = [];
  treeSpawnTimer = 0;
  nextTreeIn = getRandomTreeInterval();
  lastTreeObj = null;

  owlTree = null;
  owlActive = false;
  owlQueued = false;
  owlSpawnCountdown = 0;
  owlCompletedForLevel = false;

  treeSpawningEnabled = true;
  updateCrowSettings();

  inBonusLevel = false;
  inBossLevel = false;

  currentQuestion = null;
  showingQuestion = false;
  isPaused = false;

  message = "You died. Restarting level.";
  messageTimer = 180;
}

// ------------------
// GAME LOOP
// ------------------
function gameLoop() {
  if (onStartPage) {
    drawStartPage();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (onExplanationPage) {
    drawExplanationPage();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (onExplanationPage2) {
    drawExplanationPage2();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (onExplanationPage3) {
    drawExplanationPage3();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (onExplanationPage4) {
    drawExplanationPage4();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (!isPaused) {
    if (inBossLevel) {
      updateBossLevel();
    } else if (inBonusLevel) {
      updateBonusLevel();
    } else {
      update();
    }

    updateSquirrelAnimation();
    updateCrowAnimation();
  }

  if (inBossLevel) {
    drawBossLevel();
  } else {
    draw();
  }

  if (onOwlPage) {
    drawLevel1OwlPage();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (onLevel1OwlPage2) {
    drawLevel1OwlPage2();
    requestAnimationFrame(gameLoop);
    return;
  }

  if (onLevel1OwlPage3) {
    drawLevel1OwlPage3();
    requestAnimationFrame(gameLoop);
    return;
  }

  requestAnimationFrame(gameLoop);
}

function updateSquirrelAnimation() {
  if (isFlapping) {
    flapTimer++;

    if (flapTimer >= flapSpeed) {
      flapTimer = 0;
      currentFrame++;

      if (currentFrame >= squirrelImages.length) {
        currentFrame = 0;
        isFlapping = false; // return to glide
      }
    }
  } else {
    currentFrame = 0; // always glide frame
  }
}

function updateCrowAnimation() {
  crowFlapTimer++;

  if (crowFlapTimer >= crowFlapSpeed) {
    crowFlapTimer = 0;
    crowFrame++;

    if (crowFrame >= crowAnimationSequence.length) {
      crowFrame = 0;
    }
  }
}

function updateThrownNutsVsRaccoons() {
  if (!bossPineTreeLoaded) return;

  const pineWidth = bossPineTreeImage.naturalWidth *
    (canvas.height / bossPineTreeImage.naturalHeight);
  const pineX = canvas.width - pineWidth;
  const pineScale = canvas.height / bossPineTreeImage.naturalHeight;
  const raccoonHeight = 60;
  const rightOffsets = [20, 50, 90];

  for (let i = thrownNuts.length - 1; i >= 0; i--) {
    const nut = thrownNuts[i];

    for (let j = 0; j < raccoons.length; j++) {
      const rc = raccoons[j];
      if (rc.dead || rc.immune) continue;

      const imgSet = raccoonSets[rc.set];
      const currentImg = imgSet[rc.frame];
      if (!currentImg || !currentImg.complete) continue;

      const raccoonWidth = currentImg.naturalWidth *
        (raccoonHeight / currentImg.naturalHeight);

      const branchYFromBottom = branchOffsets[j] * pineScale;
      const raccoonY = canvas.height - branchYFromBottom - raccoonHeight;
      const raccoonX = pineX + pineWidth / 2 - raccoonWidth / 2 + rightOffsets[j];

      const rcHitbox = {
        x: raccoonX,
        y: raccoonY,
        width: raccoonWidth,
        height: raccoonHeight
      };

      if (isColliding(nut, rcHitbox)) {
        // Hit the raccoon
        rc.health = Math.max(0, rc.health - 10);
        rc.immune = true;
        rc.immuneTimer = 0;
        rc.flashTimer = 0;

        totalScore += 50;

        thrownNuts.splice(i, 1);

        // Check if dead
        if (rc.health <= 0) {
          rc.dead = true;
          rc.throwing = false;

          // Set spin starting position
          rc.spinX = raccoonX + raccoonWidth / 2;
          rc.spinY = raccoonY + raccoonHeight / 2;
          rc.spinVelX = 5;
          rc.spinVelY = -3;

          // Check if all raccoons are dead
          if (raccoons.every(r => r.dead)) {
            gameWon = true;
          }
        }

        break;
      }
    }
  }
}
